<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natu Diet — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{ margin:0; background:#f4fbfd; color:#163542; font-family:'Nunito',system-ui,sans-serif; }
  a{ color:#1596c9; }

  header{
    background:#163542; color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20; gap:12px; flex-wrap:wrap;
  }
  header h1{ font-size:16px; margin:0; font-weight:800; }
  header .status{ font-size:12.5px; opacity:.8; }
  header a.view-site{ font-size:12.5px; color:#9fe1cb; text-decoration:none; font-weight:700; }

  .shell{ display:flex; min-height:calc(100vh - 52px); }

  nav.sidebar{
    width:220px; flex:none; background:#fff; border-right:1px solid #d7e6ea; padding:14px 10px;
    position:sticky; top:52px; height:calc(100vh - 52px); overflow-y:auto;
  }
  nav.sidebar button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
    padding:10px 12px; border-radius:8px; font-family:inherit; font-size:13.5px; font-weight:700; color:#55707a;
    cursor:pointer; margin-bottom:2px;
  }
  nav.sidebar button .dot{ width:8px; height:8px; border-radius:50%; background:#cfe0e5; flex:none; }
  nav.sidebar button:hover{ background:#f0f8fa; }
  nav.sidebar button.active{ background:#e6f1fb; color:#0c447c; }
  nav.sidebar button.active .dot{ background:#1596c9; }

  main{ flex:1; padding:26px 28px 120px; max-width:720px; }
  .cat{ display:none; }
  .cat.active{ display:block; animation:fadeIn .15s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }

  .cat h2{ font-size:20px; margin:0 0 4px; font-weight:800; color:#163542; }
  .cat p.desc{ font-size:13px; color:#7c8f95; margin:0 0 22px; }

  .card{ background:#fff; border:1px solid #d7e6ea; border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  .card > strong.card-title{ display:block; font-size:13px; color:#1596c9; text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px; }

  label{ display:block; font-size:12px; font-weight:700; color:#55707a; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=password], textarea{
    width:100%; padding:9px 11px; border:1px solid #cfe0e5; border-radius:8px; font-family:inherit; font-size:14px; color:#163542;
  }
  input[type=text]:focus, textarea:focus{ outline:2px solid #85b7eb; outline-offset:1px; }
  textarea{ resize:vertical; min-height:60px; }
  input[type=color]{ width:52px; height:34px; padding:2px; border:1px solid #cfe0e5; border-radius:6px; vertical-align:middle; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:150px; }

  .color-item{ display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #f0f4f5; }
  .color-item:last-child{ border-bottom:none; }
  .color-item .swatch-label{ flex:1; font-size:13.5px; font-weight:700; }
  .color-item .swatch-hint{ font-size:12px; color:#8a9aa0; font-weight:400; display:block; }

  .hint{ font-size:12px; color:#8a9aa0; margin-top:6px; }

  .stats-row{ display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .stat-card{ flex:1; min-width:150px; background:#fff; border:1px solid #d7e6ea; border-radius:12px; padding:16px 18px; }
  .stat-card .num{ font-size:28px; font-weight:800; color:#1596c9; }
  .stat-card .lbl{ font-size:12px; font-weight:700; color:#7c8f95; text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  button.refresh{
    background:#fff; border:1px solid #cfe0e5; color:#163542; font-weight:700; font-size:13px;
    padding:8px 16px; border-radius:8px; cursor:pointer; margin-bottom:14px;
  }
  .logs-table-wrap{ overflow-x:auto; border:1px solid #d7e6ea; border-radius:12px; background:#fff; }
  table.logs-table{ width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap; }
  table.logs-table th{ text-align:left; padding:10px 12px; background:#f0f8fa; color:#55707a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
  table.logs-table td{ padding:9px 12px; border-top:1px solid #eef4f6; color:#163542; }
  table.logs-table tr:hover td{ background:#f7fbfc; }
  .logs-empty{ padding:24px; text-align:center; color:#8a9aa0; font-size:13px; }

  .pending-item{ border:1px solid #e2edf0; border-radius:10px; padding:12px 14px; margin-top:10px; border-top:1px solid #e2edf0; }
  .pending-item:first-child{ margin-top:0; }
  .testi-item{ border:1px solid #e2edf0; border-radius:10px; padding:14px 16px; margin-top:10px; border-top:1px solid #e2edf0; }
  .testi-item:first-child{ margin-top:0; }
  .testi-photo-row{ display:flex; align-items:center; gap:12px; }
  .testi-thumb{ width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid #d7e6ea; }

  .save-bar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #d7e6ea;
    padding:12px 20px; display:flex; gap:12px; align-items:center; justify-content:flex-end; z-index:20;
  }
  .save-bar input[type=password]{ max-width:200px; }
  button.save{
    background:#25d366; color:#062b15; border:none; font-weight:800; font-size:14px; padding:11px 22px;
    border-radius:999px; cursor:pointer;
  }
  button.save:disabled{ opacity:.6; cursor:default; }
  .msg{ font-size:12.5px; font-weight:700; margin-right:auto; }
  .msg.ok{ color:#3b6d11; } .msg.err{ color:#a32d2d; }

  @media (max-width:760px){
    .shell{ flex-direction:column; }
    nav.sidebar{ width:100%; height:auto; position:static; display:flex; overflow-x:auto; padding:8px; gap:4px; }
    nav.sidebar button{ white-space:nowrap; width:auto; }
    main{ padding:20px 16px 120px; }
    .save-bar{ flex-wrap:wrap; justify-content:center; }
    .msg{ margin-right:0; width:100%; text-align:center; }
  }
</style>
</head>
<body>
<header>
  <h1>Natu Diet — painel admin</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <a class="view-site" href="../" target="_blank">Ver site ↗</a>
    <span class="status" id="loadStatus">Carregando…</span>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<div class="save-bar">
  <span class="msg" id="msg"></span>
  <input type="password" id="token" placeholder="Senha do admin">
  <button class="save" id="saveBtn">Salvar alterações</button>
</div>

<script>
  var CATEGORIES = [
    { id: 'visitas', label: 'Visitas' },
    { id: 'depoimentos', label: 'Feedback' },
    { id: 'marca', label: 'Marca e contato' },
    { id: 'cores', label: 'Cores' },
    { id: 'hero', label: 'Topo do site' },
    { id: 'uso', label: 'Sugestão de uso' },
    { id: 'beneficios', label: 'Benefícios' },
    { id: 'faixa', label: 'Faixa da fórmula' },
    { id: 'precos', label: 'Preços' },
    { id: 'contra', label: 'Contraindicações' },
    { id: 'rodape', label: 'Autenticidade e rodapé' }
  ];
  var COLOR_LABELS = {
    brandBlue: ['Azul principal', 'Títulos de preço, links e detalhes'],
    brandBlueSoft: ['Azul claro', 'Faixa da fórmula e acentos suaves'],
    brandRed: ['Vermelho', '"Mais pedido" e destaques'],
    brandGreen: ['Verde', 'Ícones de check dos benefícios'],
    heroEmColor: ['Destaque do título', 'Palavra "1 cápsula" no topo']
  };

  function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

  function benefitBlock(i){
    return '<div class="row"><div style="flex:2 1 260px;">' +
      '<label>Item ' + (i+1) + ' — título</label><input type="text" data-path="benefits.items.' + i + '.title">' +
      '<label>Item ' + (i+1) + ' — descrição</label><textarea data-path="benefits.items.' + i + '.desc"></textarea>' +
      '</div></div>';
  }

  var CAT_HTML = {
    visitas:
      '<h2>Visitas</h2><p class="desc">Quem acessou o site: total, IPs únicos, navegador e dispositivo.</p>' +
      '<button class="refresh" id="refreshLogs">Atualizar</button>' +
      '<div class="stats-row">' +
        '<div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">Acessos totais</div></div>' +
        '<div class="stat-card"><div class="num" id="statUnique">—</div><div class="lbl">IPs únicos</div></div>' +
      '</div>' +
      '<div class="logs-table-wrap"><table class="logs-table"><thead><tr>' +
        '<th>Quando</th><th>IP</th><th>Navegador</th><th>Sistema</th><th>Dispositivo</th><th>Página</th>' +
      '</tr></thead><tbody id="logsBody"><tr><td colspan="6" class="logs-empty">Digite a senha e clique em Atualizar.</td></tr></tbody></table></div>',

    depoimentos:
      '<h2>Feedback</h2><p class="desc">Modere o que os clientes enviam e gerencie o feedback publicado no site.</p>' +
      '<div class="card"><strong class="card-title">Texto da seção</strong>' +
        '<label>Título</label><input type="text" data-path="testimonialsSection.title">' +
        '<label>Subtítulo</label><textarea data-path="testimonialsSection.sub"></textarea></div>' +
      '<div class="card"><strong class="card-title">Pendentes de aprovação</strong>' +
        '<button class="refresh" id="refreshPending">Atualizar pendentes</button>' +
        '<div id="pendingList"><p class="hint">Clique em "Atualizar pendentes" pra carregar.</p></div></div>' +
      '<div class="card"><strong class="card-title">Publicados no site</strong>' +
        '<div id="publishedList"><p class="hint">Carregando…</p></div>' +
        '<button type="button" class="refresh" id="addTesti" style="margin-top:10px;">+ Adicionar feedback manualmente</button>' +
        '<div class="hint">Lembre-se de clicar em "Salvar alterações" lá embaixo pra publicar de verdade.</div></div>',

    marca:
      '<h2>Marca e contato</h2><p class="desc">Nome exibido no site e os números/mensagens do WhatsApp.</p>' +
      '<div class="card"><strong class="card-title">Identidade</strong>' +
        '<div class="row"><div><label>Nome da marca</label><input type="text" data-path="brand.name"></div>' +
        '<div><label>Selo abaixo do nome</label><input type="text" data-path="brand.tag"></div></div></div>' +
      '<div class="card"><strong class="card-title">WhatsApp</strong>' +
        '<div class="row"><div><label>Número (DDI+DDD+número, só dígitos)</label><input type="text" data-path="phone" placeholder="5511999999999"></div>' +
        '<div><label>Número exibido no rodapé</label><input type="text" data-path="phoneDisplay" placeholder="(11) 99999-9999"></div></div>' +
        '<label>Mensagem — botão principal</label><textarea data-path="waMessages.hero"></textarea>' +
        '<label>Mensagem — cartão 30 cápsulas</label><textarea data-path="waMessages.p30"></textarea>' +
        '<label>Mensagem — cartão 60 cápsulas</label><textarea data-path="waMessages.p60"></textarea></div>',

    cores:
      '<h2>Cores</h2><p class="desc">Clique no quadrado colorido pra escolher uma nova cor.</p>' +
      '<div class="card">' + Object.keys(COLOR_LABELS).map(function(key){
        var lbl = COLOR_LABELS[key];
        return '<div class="color-item"><input type="color" data-path="colors.' + key + '">' +
          '<div class="swatch-label">' + lbl[0] + '<span class="swatch-hint">' + lbl[1] + '</span></div></div>';
      }).join('') + '</div>',

    hero:
      '<h2>Topo do site</h2><p class="desc">O primeiro bloco que a pessoa vê ao abrir o site.</p>' +
      '<div class="card"><strong class="card-title">Título</strong>' +
        '<label>Linha pequena acima do título</label><input type="text" data-path="hero.eyebrow">' +
        '<div class="row"><div><label>Antes do destaque</label><input type="text" data-path="hero.titleBefore"></div>' +
        '<div><label>Palavra em destaque</label><input type="text" data-path="hero.titleEm"></div>' +
        '<div><label>Depois do destaque</label><input type="text" data-path="hero.titleAfter"></div></div>' +
        '<div class="hint">Fica assim: [antes] <b>[destaque]</b> [depois]</div></div>' +
      '<div class="card"><strong class="card-title">Texto e botões</strong>' +
        '<label>Texto abaixo do título</label><textarea data-path="hero.lede"></textarea>' +
        '<div class="row"><div><label>Botão principal</label><input type="text" data-path="hero.ctaPrimary"></div>' +
        '<div><label>Botão secundário</label><input type="text" data-path="hero.ctaSecondary"></div></div>' +
        '<label>Aviso do selo (abaixo dos botões)</label><input type="text" data-path="hero.note"></div>',

    uso:
      '<h2>Sugestão de uso</h2><p class="desc">Os 3 quadros com o modo de uso do composto.</p>' +
      '<label style="margin:0 0 10px;">Título da seção</label><input type="text" data-path="ficha.heading" style="margin-bottom:16px;">' +
      '<div class="card"><strong class="card-title">Quadro 1</strong>' +
        '<div class="row"><div><label>Rótulo</label><input type="text" data-path="ficha.cap.k"></div><div><label>Valor</label><input type="text" data-path="ficha.cap.v"></div></div>' +
        '<label>Descrição</label><textarea data-path="ficha.cap.d"></textarea></div>' +
      '<div class="card"><strong class="card-title">Quadro 2</strong>' +
        '<div class="row"><div><label>Rótulo</label><input type="text" data-path="ficha.food.k"></div><div><label>Valor</label><input type="text" data-path="ficha.food.v"></div></div>' +
        '<label>Descrição</label><textarea data-path="ficha.food.d"></textarea></div>' +
      '<div class="card"><strong class="card-title">Quadro 3</strong>' +
        '<div class="row"><div><label>Rótulo</label><input type="text" data-path="ficha.water.k"></div><div><label>Valor</label><input type="text" data-path="ficha.water.v"></div></div>' +
        '<label>Descrição</label><textarea data-path="ficha.water.d"></textarea></div>',

    beneficios:
      '<h2>Benefícios</h2><p class="desc">A lista de 5 itens com check verde.</p>' +
      '<div class="card"><strong class="card-title">Cabeçalho</strong>' +
        '<label>Título da seção</label><input type="text" data-path="benefits.title">' +
        '<label>Subtítulo</label><textarea data-path="benefits.sub"></textarea></div>' +
      '<div class="card"><strong class="card-title">Os 5 itens</strong>' + [0,1,2,3,4].map(benefitBlock).join('<hr style="border:none;border-top:1px dashed #e2edf0;margin:14px 0;">') + '</div>',

    faixa:
      '<h2>Faixa da fórmula</h2><p class="desc">A faixa azul entre os benefícios e os preços.</p>' +
      '<div class="card"><label>Título</label><input type="text" data-path="strip.title">' +
        '<label>Texto</label><textarea data-path="strip.text"></textarea>' +
        '<label>Selo à direita</label><input type="text" data-path="strip.badge"></div>',

    precos:
      '<h2>Preços</h2><p class="desc">Os dois cartões de venda.</p>' +
      '<div class="card"><strong class="card-title">Cabeçalho</strong>' +
        '<label>Título da seção</label><input type="text" data-path="pricing.title">' +
        '<label>Subtítulo</label><textarea data-path="pricing.sub"></textarea></div>' +
      '<div class="card"><strong class="card-title">Cartão 30 cápsulas</strong>' +
        '<div class="row"><div><label>Nome</label><input type="text" data-path="pricing.p30.name"></div>' +
        '<div><label>Selo</label><input type="text" data-path="pricing.p30.tag"></div>' +
        '<div><label>Etiqueta do canto</label><input type="text" data-path="pricing.p30.flag"></div></div>' +
        '<div class="row"><div><label>Preço (só número)</label><input type="text" data-path="pricing.p30.price"></div>' +
        '<div><label>Texto do botão</label><input type="text" data-path="pricing.p30.cta"></div></div>' +
        '<label>Observação</label><textarea data-path="pricing.p30.note"></textarea></div>' +
      '<div class="card"><strong class="card-title">Cartão 60 cápsulas</strong>' +
        '<div class="row"><div><label>Nome</label><input type="text" data-path="pricing.p60.name"></div>' +
        '<div><label>Selo</label><input type="text" data-path="pricing.p60.tag"></div>' +
        '<div><label>Etiqueta do canto</label><input type="text" data-path="pricing.p60.flag"></div></div>' +
        '<div class="row"><div><label>Preço (só número)</label><input type="text" data-path="pricing.p60.price"></div>' +
        '<div><label>Texto do botão</label><input type="text" data-path="pricing.p60.cta"></div></div>' +
        '<label>Faixa "mais pedido"</label><input type="text" data-path="pricing.p60.badge">' +
        '<label>Observação</label><textarea data-path="pricing.p60.note"></textarea></div>',

    contra:
      '<h2>Contraindicações</h2><p class="desc">Lista de avisos exibida no rodapé do site.</p>' +
      '<div class="card">' + [0,1,2,3,4].map(function(j){
        return '<label>Item ' + (j+1) + '</label><input type="text" data-path="contraindicacoes.' + j + '">';
      }).join('') + '</div>',

    rodape:
      '<h2>Autenticidade e rodapé</h2><p class="desc">Textos finais de confiança e regulatórios.</p>' +
      '<div class="card"><label>Texto de autenticidade</label><textarea data-path="autenticidade"></textarea>' +
        '<label>Linha final (regulatório)</label><textarea data-path="fine"></textarea>' +
        '<label>Linha do rodapé (antes do telefone)</label><input type="text" data-path="footer.line"></div>'
  };

  var sidebar = document.getElementById('sidebar');
  var main = document.getElementById('main');

  CATEGORIES.forEach(function(cat, idx){
    var btn = document.createElement('button');
    btn.innerHTML = '<span class="dot"></span>' + cat.label;
    btn.dataset.cat = cat.id;
    if (idx === 0) btn.className = 'active';
    btn.addEventListener('click', function(){ selectCat(cat.id); });
    sidebar.appendChild(btn);

    var section = el('<section class="cat' + (idx === 0 ? ' active' : '') + '" id="cat-' + cat.id + '">' + CAT_HTML[cat.id] + '</section>');
    main.appendChild(section);
  });

  function selectCat(id){
    document.querySelectorAll('nav.sidebar button').forEach(function(b){ b.classList.toggle('active', b.dataset.cat === id); });
    document.querySelectorAll('main .cat').forEach(function(s){ s.classList.toggle('active', s.id === 'cat-' + id); });
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    if (id === 'visitas' && document.getElementById('token').value) loadLogs();
    if (id === 'depoimentos' && document.getElementById('token').value) loadPending();
  }

  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function loadLogs(){
    var token = document.getElementById('token').value;
    var body = document.getElementById('logsBody');
    if (!token){
      document.getElementById('msg').textContent = 'Digite a senha primeiro.';
      document.getElementById('msg').className = 'msg err';
      return;
    }
    body.innerHTML = '<tr><td colspan="6" class="logs-empty">Carregando…</td></tr>';
    fetch('../api/logs?token=' + encodeURIComponent(token))
      .then(function(r){ return r.json().then(function(b){ return { ok: r.ok, body: b }; }); })
      .then(function(res){
        if (!res.ok){
          body.innerHTML = '<tr><td colspan="6" class="logs-empty">Erro: ' + escapeHtml(res.body.error || 'falha ao carregar') + '</td></tr>';
          return;
        }
        document.getElementById('statTotal').textContent = res.body.total;
        document.getElementById('statUnique').textContent = res.body.uniqueIps;
        var entries = res.body.entries || [];
        if (!entries.length){
          body.innerHTML = '<tr><td colspan="6" class="logs-empty">Nenhum acesso registrado ainda.</td></tr>';
          return;
        }
        body.innerHTML = entries.map(function(e){
          return '<tr><td>' + fmtDate(e.t) + '</td><td>' + escapeHtml(e.ip) + '</td><td>' + escapeHtml(e.browser) +
            '</td><td>' + escapeHtml(e.os) + '</td><td>' + escapeHtml(e.device) + '</td><td>' + escapeHtml(e.path) + '</td></tr>';
        }).join('');
      })
      .catch(function(err){
        body.innerHTML = '<tr><td colspan="6" class="logs-empty">Erro de rede: ' + escapeHtml(err) + '</td></tr>';
      });
  }

  main.addEventListener('click', function(ev){
    if (ev.target && ev.target.id === 'refreshLogs') loadLogs();
  });

  function pathGet(obj, path){
    return path.split('.').reduce(function(o,k){ return (o && o[k] !== undefined) ? o[k] : undefined; }, obj);
  }
  function pathSet(obj, path, value){
    var parts = path.split('.'), cur = obj;
    for (var i = 0; i < parts.length - 1; i++){
      var key = parts[i], nextKey = parts[i+1], isArrayNext = /^\d+$/.test(nextKey);
      if (cur[key] === undefined) cur[key] = isArrayNext ? [] : {};
      cur = cur[key];
    }
    cur[parts[parts.length - 1]] = value;
  }

  function testiCardHtml(idx, t){
    t = t || {};
    var img = t.image || '';
    return '<div class="item-block testi-item">' +
      '<div class="row"><div><label>Nome</label><input type="text" data-path="testimonials.' + idx + '.name" value="' + escapeHtml(t.name) + '"></div>' +
      '<div style="max-width:110px;"><label>Nota (1-5)</label><input type="text" data-path="testimonials.' + idx + '.rating" value="' + escapeHtml(t.rating || 5) + '"></div></div>' +
      '<label>Feedback</label><textarea data-path="testimonials.' + idx + '.text">' + escapeHtml(t.text) + '</textarea>' +
      '<label>Foto</label>' +
      '<div class="testi-photo-row">' +
        (img ? '<img class="testi-thumb" src="' + escapeHtml(img) + '">' : '<span class="hint">Sem foto</span>') +
        '<input type="file" class="testi-upload" accept="image/png,image/jpeg,image/webp,image/gif">' +
      '</div>' +
      '<input type="hidden" data-path="testimonials.' + idx + '.image" value="' + escapeHtml(img) + '">' +
      '<button type="button" class="refresh remove-testi" style="margin-top:8px;color:#a32d2d;">Remover</button>' +
    '</div>';
  }

  function renderPublishedInitial(list){
    var wrap = document.getElementById('publishedList');
    if (!wrap) return;
    if (!list || !list.length){ wrap.innerHTML = '<p class="hint">Nenhum feedback publicado ainda.</p>'; return; }
    wrap.innerHTML = list.map(function(t, i){ return testiCardHtml(i, t); }).join('');
  }

  function reindexTestimonials(){
    var wrap = document.getElementById('publishedList');
    if (!wrap) return;
    var items = wrap.querySelectorAll('.testi-item');
    if (!items.length){ wrap.innerHTML = '<p class="hint">Nenhum feedback publicado ainda.</p>'; return; }
    items.forEach(function(item, i){
      item.querySelectorAll('[data-path]').forEach(function(elm){
        var field = elm.getAttribute('data-path').split('.').pop();
        elm.setAttribute('data-path', 'testimonials.' + i + '.' + field);
      });
    });
  }

  document.addEventListener('click', function(ev){
    if (ev.target && ev.target.id === 'addTesti'){
      var wrap = document.getElementById('publishedList');
      var placeholder = wrap.querySelector('.hint');
      if (placeholder) wrap.innerHTML = '';
      var idx = wrap.querySelectorAll('.testi-item').length;
      wrap.insertAdjacentHTML('beforeend', testiCardHtml(idx, {}));
    }
    if (ev.target && ev.target.classList && ev.target.classList.contains('remove-testi')){
      ev.target.closest('.testi-item').remove();
      reindexTestimonials();
    }
    if (ev.target && ev.target.id === 'refreshPending'){
      loadPending();
    }
  });

  document.addEventListener('change', function(ev){
    if (!ev.target.classList || !ev.target.classList.contains('testi-upload')) return;
    var file = ev.target.files[0];
    if (!file) return;
    var item = ev.target.closest('.testi-item');
    var hidden = item.querySelector('input[type=hidden][data-path$=".image"]');
    var row = ev.target.closest('.testi-photo-row');
    var reader = new FileReader();
    reader.onload = function(){
      fetch('../api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: file.name, dataUrl: reader.result })
      }).then(function(r){ return r.json().then(function(b){ return { ok: r.ok, body: b }; }); })
        .then(function(res){
          if (res.ok){
            hidden.value = res.body.url;
            var hint = row.querySelector('.hint');
            if (hint) hint.remove();
            var thumb = row.querySelector('img.testi-thumb');
            if (thumb) thumb.src = res.body.url;
            else row.insertAdjacentHTML('afterbegin', '<img class="testi-thumb" src="' + res.body.url + '">');
          } else {
            alert('Erro ao enviar imagem: ' + (res.body.error || 'falha'));
          }
        })
        .catch(function(err){ alert('Erro de rede: ' + err); });
    };
    reader.readAsDataURL(file);
  });

  function pendingCardHtml(e){
    var n = Math.max(1, Math.min(5, parseInt(e.rating, 10) || 5));
    var stars = '★★★★★☆☆☆☆'.slice(5 - n, 10 - n);
    var img = e.image ? '<img class="testi-thumb" src="' + escapeHtml(e.image) + '" style="margin-bottom:8px;">' : '';
    return '<div class="item-block pending-item" data-id="' + escapeHtml(e.id) + '" data-image="' + escapeHtml(e.image || '') + '">' +
      img +
      '<div class="row"><div><strong>' + escapeHtml(e.name) + '</strong> <span style="color:#1596c9;">' + stars + '</span></div></div>' +
      '<p style="font-size:13.5px;color:#163542;margin:8px 0;">' + escapeHtml(e.text) + '</p>' +
      '<div class="row">' +
        '<button type="button" class="refresh approve-testi" style="color:#3b6d11;">Aprovar</button>' +
        '<button type="button" class="refresh reject-testi" style="color:#a32d2d;">Rejeitar</button>' +
      '</div></div>';
  }

  function loadPending(){
    var token = document.getElementById('token').value;
    var wrap = document.getElementById('pendingList');
    if (!token){ document.getElementById('msg').textContent = 'Digite a senha primeiro.'; document.getElementById('msg').className = 'msg err'; return; }
    wrap.innerHTML = '<p class="hint">Carregando…</p>';
    fetch('../api/feedback-pending?token=' + encodeURIComponent(token))
      .then(function(r){ return r.json().then(function(b){ return { ok: r.ok, body: b }; }); })
      .then(function(res){
        if (!res.ok){ wrap.innerHTML = '<p class="hint">Erro: ' + escapeHtml(res.body.error || 'falha') + '</p>'; return; }
        var entries = res.body.entries || [];
        if (!entries.length){ wrap.innerHTML = '<p class="hint">Nenhum feedback pendente.</p>'; return; }
        wrap.innerHTML = entries.map(pendingCardHtml).join('');
      })
      .catch(function(err){ wrap.innerHTML = '<p class="hint">Erro de rede: ' + escapeHtml(err) + '</p>'; });
  }

  function removePending(id){
    var token = document.getElementById('token').value;
    return fetch('../api/feedback-remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, id: id })
    });
  }

  document.addEventListener('click', function(ev){
    var card = ev.target.closest && ev.target.closest('.pending-item');
    if (!card) return;
    var id = card.getAttribute('data-id');
    if (ev.target.classList.contains('approve-testi')){
      var wrap = document.getElementById('publishedList');
      var placeholder = wrap.querySelector('.hint');
      if (placeholder) wrap.innerHTML = '';
      var idx = wrap.querySelectorAll('.testi-item').length;
      var name = card.querySelector('strong').textContent;
      var text = card.querySelector('p').textContent;
      var starsTxt = card.querySelector('span').textContent;
      var rating = (starsTxt.match(/★/g) || []).length || 5;
      var image = card.getAttribute('data-image') || '';
      wrap.insertAdjacentHTML('beforeend', testiCardHtml(idx, { name: name, rating: rating, text: text, image: image }));
      removePending(id).then(function(){ card.remove(); });
    } else if (ev.target.classList.contains('reject-testi')){
      removePending(id).then(function(){ card.remove(); });
    }
  });

  fetch('../content.json', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(data){
      document.querySelectorAll('[data-path]').forEach(function(elm){
        var val = pathGet(data, elm.getAttribute('data-path'));
        if (val !== undefined) elm.value = val;
      });
      renderPublishedInitial(data.testimonials);
      document.getElementById('loadStatus').textContent = 'Conteúdo carregado';
    })
    .catch(function(){
      document.getElementById('loadStatus').textContent = 'Não achei content.json (site novo?)';
    });

  var savedToken = sessionStorage.getItem('natuDietAdminToken');
  if (savedToken) document.getElementById('token').value = savedToken;

  document.getElementById('saveBtn').addEventListener('click', function(){
    var msg = document.getElementById('msg');
    var token = document.getElementById('token').value;
    if (!token){ msg.textContent = 'Digite a senha primeiro.'; msg.className = 'msg err'; return; }
    sessionStorage.setItem('natuDietAdminToken', token);

    var content = {};
    document.querySelectorAll('[data-path]').forEach(function(elm){
      pathSet(content, elm.getAttribute('data-path'), elm.value);
    });

    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    msg.textContent = 'Salvando…';
    msg.className = 'msg';

    fetch('../api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, content: content })
    })
      .then(function(r){ return r.json().then(function(body){ return { ok: r.ok, body: body }; }); })
      .then(function(res){
        btn.disabled = false;
        if (res.ok){
          msg.textContent = 'Salvo! O site atualiza em ~1 minuto.';
          msg.className = 'msg ok';
        } else {
          msg.textContent = 'Erro: ' + (res.body.error || 'falha ao salvar');
          msg.className = 'msg err';
        }
      })
      .catch(function(err){
        btn.disabled = false;
        msg.textContent = 'Erro de rede: ' + err;
        msg.className = 'msg err';
      });
  });
</script>
</body>
</html>
